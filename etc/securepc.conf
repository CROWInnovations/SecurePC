# Firewall enforcement backend:
#   "auto"        - Automatically prefers native dual-stack nftables on modern
#                   Linux (Ubuntu 22.04+, Mint 21+, Debian 11+, Kali, RHEL 8+,
#                   Fedora, Arch), falls back to iptables+ip6tables+ipset on
#                   legacy Linux kernels, or Solaris pf/ipf on SunOS/illumos.
#   "nftables"    - Force native nftables ('table inet securepc').
#   "iptables"    - Force legacy iptables + ip6tables + ipset backend.
#   "solaris_ipf" - Force Solaris 11.4 pf / illumos IP Filter (ipf) backend.
FIREWALL_BACKEND="auto"

# Outbound blocking action for local processes:
#   "reject" - Immediately send TCP RST / ICMP Port Unreachable so browsers and
#              CLI tools fail in milliseconds instead of hanging on timeouts.
#   "drop"   - Silently drop outbound packets (stealth, causes TCP SYN timeouts).
# (Note: Inbound blocked traffic is always stealth-DROPped regardless of this setting.)
OUTBOUND_BLOCK_ACTION="reject"

# Enable IPv6 blocking, DNS/SNI inspection, and GeoIP enforcement (1 = yes, 0 = no)
ENABLE_IPV6="1"

# Prevent browsers & applications from bypassing domain-level blocking via
# DNS-over-HTTPS (DoH), DNS-over-TLS (DoT), or DNS-over-QUIC (DoQ):
# Blocks TCP/UDP port 853 and HTTPS/HTTP3 (TCP/UDP 443) to known public DoH
# resolver IPs while still allowing inspected standard DNS on port 53.
BLOCK_DOH_DOT="1"

# Install OS-level managed browser policies (Firefox/Firefox-ESR, Chrome,
# Chromium, Brave, Edge) locking DNS-over-HTTPS=Off and disabling ECH bypasses.
ENFORCE_BROWSER_POLICIES="1"

# Enable fail-safe synchronous NFQUEUE (bypass mode) inspection of outbound DNS
# QNAMEs, TLS ClientHello SNI, and HTTP Host headers (1 = yes, 0 = no).
ENABLE_NFQUEUE_DPI="1"
NFQUEUE_NUM="5353"

# Enable live direct-by-IP OpenSSL X.509 certificate inspection on allowed
# public endpoints (never probes hard-blocked CN/RU/IR/Middle East IPs).
ENABLE_OPENSSL_PROBES="1"

# Optional space-separated list of local system usernames restricted strictly to
# RFC1918 LAN communication (blocks all public internet egress for those UIDs).
# Non-existent usernames on the current host are skipped safely without error.
SANDBOX_LAN_ONLY_USERS=""
